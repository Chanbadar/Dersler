apiVersion: v1
kind: Pod
metadata:
  name: check
  namespace: hafta6
spec:
  restartPolicy: Never
  containers:
  - name: check
    image: dersnotlari-web:1.1
    imagePullPolicy: Never
    command: [python, -c, "import time; time.sleep(86400)"]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
